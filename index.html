    <style>
        body { background-color: #0f172a; overflow: hidden; margin: 0; }
        #jwplayerDiv { width: 100% !important; height: 100% !important; }
        
        /* التحكم التلقائي في الأبعاد لملء الشاشة بالكامل */
        .expanded-video .jw-video { object-fit: fill !important; width: 100% !important; height: 100% !important; } 
        .contained-video .jw-video { object-fit: contain !important; }
        
        /* إخفاء الأزرار الافتراضية للمشغل لاستبدالها بالأيقونات المخصصة */

<body class="text-white h-screen flex">

    <!-- Sidebar / قائمة القنوات -->
    <div class="w-72 bg-slate-900 h-full flex flex-col fixed left-0 top-0 border-r border-slate-800 z-50 shadow-xl">
        
        <div class="p-4 bg-slate-800 flex items-center gap-3 border-b border-slate-700">

            <button id="homeBtn" class="bg-slate-700 hover:bg-blue-600 text-white p-2 rounded transition flex-shrink-0 shadow-md" title="الشاشة الرئيسية / إغلاق البث">

            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-3" id="channelListContainer"></div>
    </div>

    <!-- Main Content / منطقة الفيديو -->

        <!-- الشاشة الرئيسية (خلفية استاد احترافية) -->

                <i class="fa-solid fa-tv text-6xl text-blue-500 mb-4"></i>
                <h1 class="text-5xl font-bold mb-4 text-white drop-shadow-lg tracking-wide">sc8tv</h1>
                <p class="text-lg text-gray-300 drop-shadow-md">اختر قناة من القائمة الجانبية لبدء المشاهدة</p>
            </div>
        </div>

        <!-- المشغل -->
        <div id="playerContainer" class="w-full h-full hidden z-20 absolute inset-0 bg-black">
            <div id="jwplayerDiv" class="expanded-video"></div>
        </div>

                { id: "art-aflam1", name: "ART أفلام (2)", url: "https://ev-fast-mpd.starzplayarabia.com/live/eds/ART_Aflam/DASH/ART_Aflam.mpd", k1: "264e7cb9dfd6b9e5c281c97db4c2b4fa", k2: "47425a7e8f7e4030d186559852ae97db" },

                { id: "art-cinema", name: "ART سينما", url: "https://ev-fast-mpd.starzplayarabia.com/live/eds/ART_Cinema/DASH/ART_Cinema.mpd", k1: "bd484fc91dcf152010a0e367e15ab60e", k2: "d9bed0a77b7da410129820bcc6606670" },
                { id: "art-hekayat1", name: "ART حكايات 1", url: "https://ev-fast-mpd.starzplayarabia.com/live/eds/ART_Hekayat/DASH/ART_Hekayat.mpd", k1: "3d614bb04140eda383d117fb55e9a361", k2: "b669cdf2cb65eff56d1e3534c7a54b53" },
                { id: "art-hekayat2", name: "ART حكايات 2", url: "https://ev-fast-mpd.starzplayarabia.com/live/eds/ART_Hekayat_2/DASH/ART_Hekayat_2.mpd", k1: "4ccb01903d6868e27953ff0298d4ac05", k2: "d156518d6ab453d9f9d12c243280be8f" }
            ],
            "قنوات منوعة": [
                { id: "mbc-action", name: "MBC Action", url: "https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-action/8ea6ca1108d03e03da5e61372354f5c8/index.mpd", k1: "e3ce77324a3d4fa2a913b26cc1976052", k2: "17774f82a3b9e33ea7a149596acbb20f" },
                { id: "mbc-masr-2", name: "MBC Masr 2", url: "https://shd-mediacdn-live.edgenextcdn.net/live/bitmovin-mbc-masr-2/7eaa7c0393e9a9637ae311aac75eb40e/index.mpd", k1: "e3ce77324a3d4fa2a913b26cc1976052", k2: "17774f82a3b9e33ea7a149596acbb20f" },
                { id: "Sport_2SK", name: "Sport 2 SK", url: "https://dash2.antik.sk/stream/nvidia_sport2/playlist_cenc.mpd", k1: "11223344556677889900112233445566", k2: "4b80724d0ef86bcb2c21f7999d67739d" },
                { id: "ZIGGO_1", name: "ZIGGO 1", url: "https://mag04.tvx.prd.tv.odido.nl/wh7f454c46tw75168188_-627298088/PLTV/86/224/3221241590/3221241590.mpd?accountinfo=~~V2.0~qbcsJh_jU5C9BcZc959e_wae44b4867b3417aa76b5db2da20fe46c~KZzTWjB8qD1zdgbJjRPVLJX-tV0qiN9RBHC_iseGrsmTSRjj06oGDtGlpSCRGOwF3626cf085c08d024c7e4aafc18c32440:UTC,", k1: "ef34ae91b4f2415e8439b2ad105e7488", k2: "243248d8de1ff8c7c587ee2057317523" },
                { id: "Fubo_Sports_2", name: "Fubo Sports 2", url: "https://otte.live.fly.ww.aiv-cdn.net/pdx-nitro/live/clients/dash/enc/uiffe4jhf0/out/v1/3534efafca8c4815adbb4d2e9a1fe003/cenc.mpd", k1: "3dcfbec0e7146928baa55210bf2cb62f", k2: "bc85f74f815d9be5ae1dd6defaa05135" },
                { id: "Premier_League", name: "Premier League", url: "https://otte.live.fly.ww.aiv-cdn.net/pdx-nitro/live/clients/dash/enc/uiffe4jhf0/out/v1/3534efafca8c4815adbb4d2e9a1fe003/cenc.mpd", k1: "3dcfbec0e7146928baa55210bf2cb62f", k2: "bc85f74f815d9be5ae1dd6defaa05135" },
                { id: "Матч!_1", name: "Матч! 1", url: "https://video.beeline.tv/live/d/channel319.isml/manifest-stb.mpd", k1: "ce7cf9b28d1a8d874accebc44d7e1fcd", k2: "cda18d4d20abd5cc778315abe277feb9" }
            ]
        };

        const channelListContainer = document.getElementById('channelListContainer');
        const searchInput = document.getElementById('searchInput');
        let currentPlayer = null;
        let isExpanded = true; 
        let activeChannelId = null;

        // الأيقونات بصيغة SVG مطابقة للصورة المرفقة
        const iconExpandShrink = `<svg viewBox="0 0 24 24" fill="white" width="20px" height="20px"><path d="M10 21v-2H6.41l4.5-4.5-1.41-1.41-4.5 4.5V14H3v7h7zm11-7h-2v3.59l-4.5-4.5-1.41 1.41 4.5 4.5H14v2h7v-7zM3 10h2V6.41l4.5 4.5 1.41-1.41-4.5-4.5H10V3H3v7zm14.5-2.5L13 12.09l1.41 1.41 4.5-4.5V10h2V3h-7v2h3.59z"/></svg>`;
        const iconPiP = `<svg viewBox="0 0 24 24" fill="white" width="20px" height="20px"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zm-10-7h7v5h-7v-5z"/></svg>`;
        const iconSettings = `<svg viewBox="0 0 24 24" fill="white" width="20px" height="20px"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.05-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22l-1.92 3.32c-.12.22-.07.49.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>`;
        const iconFullscreen = `<svg viewBox="0 0 24 24" fill="white" width="20px" height="20px"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>`;

        function renderChannels(filter = "") {
            channelListContainer.innerHTML = '';
            for (const [category, channels] of Object.entries(channelsData)) {
                const filteredChannels = channels.filter(ch => ch.name.includes(filter) || ch.id.toLowerCase().includes(filter.toLowerCase()));
                if (filteredChannels.length === 0) continue;

                const catDiv = document.createElement('div');
                catDiv.className = 'mb-4';
                
                // خط القوائم الرئيسية باللون الأبيض (text-white)
                catDiv.innerHTML = `<h3 class="w-full block text-right text-white text-sm font-bold bg-slate-800/80 border border-blue-400/50 py-2 px-3 mb-2 rounded shadow-sm">${category}</h3>`;
                
                const ul = document.createElement('ul');
                ul.className = 'space-y-1';
                
                filteredChannels.forEach(ch => {
                    const li = document.createElement('li');
                    const isActive = activeChannelId === ch.id;
                    const bgClass = isActive ? 'bg-[#1e3a8a] border-r-4 border-blue-400 text-blue-50 font-bold' : 'text-gray-300 hover:bg-slate-700 hover:text-white border-r-4 border-transparent';
                    
                    li.innerHTML = `
                        <button onclick="playChannel('${ch.id}', '${ch.url}', '${ch.k1}', '${ch.k2}')" 
                            class="w-full text-right px-3 py-2.5 text-sm rounded transition flex justify-between items-center group ${bgClass}">
                            <span>${ch.name}</span>
                            <i class="fa-solid fa-play text-xs ${isActive ? 'opacity-100 text-blue-200' : 'opacity-0 group-hover:opacity-100'} transition"></i>
                        </button>
                    `;
                    ul.appendChild(li);
                });
                
                catDiv.appendChild(ul);
                channelListContainer.appendChild(catDiv);
            }
        }

        function playChannel(id, url, k1, k2) {
            activeChannelId = id;
            renderChannels(searchInput.value);

            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('playerContainer').classList.remove('hidden');
            
            if (currentPlayer) currentPlayer.remove();

            const container = document.getElementById('playerContainer');
            container.innerHTML = `<div id="jwplayerDiv" class="${isExpanded ? 'expanded-video' : 'contained-video'}"></div>`;

            currentPlayer = jwplayer("jwplayerDiv").setup({
                file: url,
                width: "100%",
                height: "100%",
                autostart: true,
                stretching: "exactfit", 
                drm: { clearkey: { keyId: k1, key: k2 } }
            });

            currentPlayer.on('ready', function() {
                addCustomButtons();
            });
            
            currentPlayer.on('audioTracks', function() {
                const tracks = currentPlayer.getAudioTracks();
                tracks.forEach((track, index) => {
                    if (track.label.toLowerCase().includes("ara") || track.label.includes("عربي")) {
                        currentPlayer.setCurrentAudioTrack(index);
                    }
                });
            });
        }

        function addCustomButtons() {
            // إضافة الأزرار بنفس ترتيب الصورة
            
            // 1. زر توسيع وتضييق الشاشة
            currentPlayer.addButton(iconExpandShrink, 'تغيير أبعاد الصورة', function() {
                isExpanded = !isExpanded;
                const playerDiv = document.getElementById('jwplayerDiv');
                if(isExpanded) {
                    playerDiv.classList.remove('contained-video');
                    playerDiv.classList.add('expanded-video');
                } else {
                    playerDiv.classList.remove('expanded-video');
                    playerDiv.classList.add('contained-video');
                }
            }, 'customExpandBtn');

            // 2. زر الإعدادات
            currentPlayer.addButton(iconSettings, 'الإعدادات', function() {
                const settingsMenu = document.querySelector('.jw-settings-menu');
                if(settingsMenu) {
                    settingsMenu.style.display = settingsMenu.style.display === 'none' || settingsMenu.style.display === '' ? 'block' : 'none';
                }
            }, 'customSettingsBtn');

            // 3. زر صورة داخل صورة
            currentPlayer.addButton(iconPiP, 'صورة داخل صورة', function() {
                const video = document.querySelector('video');
                if (video && typeof video.requestPictureInPicture === 'function') {
                    if (document.pictureInPictureElement) {
                        document.exitPictureInPicture();
                    } else {
                        video.requestPictureInPicture();
                    }
                }
            }, 'customPipBtn');

            // 4. زر ملء الشاشة
            currentPlayer.addButton(iconFullscreen, 'ملء الشاشة', function() {
                currentPlayer.setFullscreen(!currentPlayer.getFullscreen());
            }, 'customFullscreenBtn');
        }

        document.getElementById('homeBtn').addEventListener('click', () => {
            if (currentPlayer) { currentPlayer.remove(); currentPlayer = null; }
            activeChannelId = null;
            renderChannels(searchInput.value);
            document.getElementById('playerContainer').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
        });

        searchInput.addEventListener('input', (e) => renderChannels(e.target.value));
        window.addEventListener("beforeunload", () => { if(currentPlayer) currentPlayer.remove(); });
        document.addEventListener("visibilitychange", () => { if (document.hidden && currentPlayer) currentPlayer.pause(); });

        renderChannels();
    </script>
</body>
</html>
