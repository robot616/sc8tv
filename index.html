    <script>
        (function() {

            var originalXHR = window.XMLHttpRequest;
            var customUA = "Mozilla/5.0 (Smart-TV; Linux; Tizen 6.0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/85.0.4183.102 TV Safari/537.36";
            window.fetch = function(url, options) {
                options = options || {};
                options.headers = options.headers || {};
                options.headers['User-Agent'] = customUA;
                return originalFetch.call(this, url, options);
            };
            var XHROpen = originalXHR.prototype.open;

            "Art-Aflam": { url: "https://ev-tcn-dxb-cdn.aws.playco.com/live/eds/ART_Aflam/DASH/ART_Aflam.mpd", k1: "47425a7e8f7e4030d186559852ae97db", k2: "264e7cb9dfd6b9e5c281c97db4c2b4fa" },
            "shahid-sports-1": { url: "https://shahid-sports-1-enc.edgenextcdn.net/out/v1/0169cfa282614ebe97ef0201da87bb04/index.mpd", k1: "ab081a704aad41829b1123b09b6ecafd", k2: "dd51609092fff15e68b91debf5d591f9" },
            "shahid-sports-4": { url: "https://shahid-sports-4-enc.edgenextcdn.net/out/v1/f813ab47644d4c41a99285513f6c7409/index.mpd", k1: "6477160076644679af1028534f03f67e", k2: "1267f99705113a62c7782c4d5281a7eb" },

            "art-aflam1": { url: "https://ev-fast-mpd.starzplayarabia.com/live/eds/ART_Aflam/DASH/ART_Aflam.mpd", k1: "264e7cb9dfd6b9e5c281c97db4c2b4fa", k2: "47425a7e8f7e4030d186559852ae97db" },

            "Sport_2SK": { url: "https://dash2.antik.sk/stream/nvidia_sport2/playlist_cenc.mpd", k1: "11223344556677889900112233445566", k2: "4b80724d0ef86bcb2c21f7999d67739d" },
            "ZIGGO_1": { url: "https://mag04.tvx.prd.tv.odido.nl/wh7f454c46tw75168188_-627298088/PLTV/86/224/3221241590/3221241590.mpd?accountinfo=~~V2.0~qbcsJh_jU5C9BcZc959e_wae44b4867b3417aa76b5db2da20fe46c~KZzTWjB8qD1zdgbJjRPVLJX-tV0qiN9RBHC_iseGrsmTSRjj06oGDtGlpSCRGOwF3626cf085c08d024c7e4aafc18c32440:UTC,", k1: "ef34ae91b4f2415e8439b2ad105e7488", k2: "243248d8de1ff8c7c587ee2057317523" },
            "Fubo_Sports_2": { url: "https://otte.live.fly.ww.aiv-cdn.net/pdx-nitro/live/clients/dash/enc/uiffe4jhf0/out/v1/3534efafca8c4815adbb4d2e9a1fe003/cenc.mpd", k1: "3dcfbec0e7146928baa55210bf2cb62f", k2: "bc85f74f815d9be5ae1dd6defaa05135" },
            "mbc-action": { url: "https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-action/8ea6ca1108d03e03da5e61372354f5c8/index.mpd", k1: "e3ce77324a3d4fa2a913b26cc1976052", k2: "17774f82a3b9e33ea7a149596acbb20f" },
            "Premier_League": { url: "https://otte.live.fly.ww.aiv-cdn.net/pdx-nitro/live/clients/dash/enc/uiffe4jhf0/out/v1/3534efafca8c4815adbb4d2e9a1fe003/cenc.mpd", k1: "3dcfbec0e7146928baa55210bf2cb62f", k2: "bc85f74f815d9be5ae1dd6defaa05135" },
            "mbc-masr-2": { url: "https://shd-mediacdn-live.edgenextcdn.net/live/bitmovin-mbc-masr-2/7eaa7c0393e9a9637ae311aac75eb40e/index.mpd", k1: "e3ce77324a3d4fa2a913b26cc1976052", k2: "17774f82a3b9e33ea7a149596acbb20f" },
            "shahid-sports-2": { url: "https://shahid-sports-2-enc.edgenextcdn.net/out/v1/589aa6b16ce942388695b5b214f4ae93/index.mpd", k1: "50a7f3afc00a40b38face4db639d0e4c", k2: "ad7000691326064706281a700b7d6714" },
            "shahid-sports-3": { url: "https://live-event-3-enc.edgenextcdn.net/out/v1/1117b28b859948afa6d5660460b392df/index.mpd", k1: "448128e485ef44d98024e7c5f3fa078b", k2: "a5759aeb79afae384819a20c481e2c4a" },
            "Матч!_1": { url: "https://video.beeline.tv/live/d/channel319.isml/manifest-stb.mpd", k1: "ce7cf9b28d1a8d874accebc44d7e1fcd", k2: "cda18d4d20abd5cc778315abe277feb9" }
        };

        let playerInstance = null;
        let isExpanded = true;
        const channelContainer = document.getElementById('channelListContainer');
        const homeImage = document.getElementById('homeImage');
        const homeOverlay = document.getElementById('homeOverlay');

        // 1. توليد قائمة القنوات
        function renderChannels() {
            Object.keys(channelList).forEach(channelKey => {
                const btn = document.createElement('button');
                btn.className = 'channel-btn w-full text-right px-4 py-3 rounded-lg bg-[#1a1d24] hover:bg-blue-600 border border-[#2a2e39] hover:border-blue-500 text-gray-300 hover:text-white transition-all duration-200 text-sm font-medium flex items-center gap-3 group';
                btn.dataset.name = channelKey;
                
                // إضافة أيقونة بلاي صغيرة بجوار اسم القناة
                btn.innerHTML = `
                    <svg class="w-4 h-4 opacity-50 group-hover:opacity-100 transition-opacity" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    <span class="truncate">${channelKey}</span>
                `;
                
                btn.onclick = () => playChannel(channelKey);
                channelContainer.appendChild(btn);
            });
        }

        // 2. دالة تشغيل القناة
        function playChannel(channelName) {
            const channelData = channelList[channelName];
            if (!channelData) return;

            // إخفاء صورة الشاشة الرئيسية بتأثير حركي
            homeImage.style.opacity = '0';
            homeOverlay.style.opacity = '0';
            setTimeout(() => { 
                homeImage.style.display = 'none'; 
                homeOverlay.style.display = 'none';
            }, 400);

            // تدمير المشغل القديم إن وجد لتنظيف الذاكرة
            if (playerInstance) {
                playerInstance.remove();
            }
            // إعادة حقن حاوية المشغل
            document.getElementById('playerContainer').innerHTML = '<div id="jwplayerDiv"></div>';

            // تلوين الزر النشط
            document.querySelectorAll('.channel-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'border-blue-500', 'text-white');
                b.classList.add('bg-[#1a1d24]', 'border-[#2a2e39]', 'text-gray-300');
            });
            const activeBtn = document.querySelector(`.channel-btn[data-name="${channelName}"]`);
            if(activeBtn) {
                activeBtn.classList.add('bg-blue-600', 'border-blue-500', 'text-white');
                activeBtn.classList.remove('bg-[#1a1d24]', 'border-[#2a2e39]', 'text-gray-300');
            }

            // إعداد المشغل
            playerInstance = jwplayer("jwplayerDiv").setup({
                file: channelData.url,
                width: "100%",
                height: "100%",
                autostart: true,
                stretching: "fill",
                drm: { 
                    clearkey: { 
                        keyId: channelData.k1, 
                        key: channelData.k2 
                    } 
                }
            });

            // إضافة زر التمدد واختيار الصوت العربي
            playerInstance.on('ready', function() {
                playerInstance.addButton(expandSvg, 'تمدد الفيديو', function() {
                    isExpanded = !isExpanded;
                    const video = document.querySelector("#jwplayerDiv video");
                    if (video) video.style.objectFit = isExpanded ? 'fill' : 'contain';
                }, 'expandButton');
            });

            playerInstance.on('audioTracks', function() {
                const tracks = playerInstance.getAudioTracks();
                tracks.forEach((track, index) => {
                    if (track.label.toLowerCase().includes("ara") || track.label.includes("عربي")) {
                        playerInstance.setCurrentAudioTrack(index);
                    }
                });
            });
        }

        // 3. دالة زر الشاشة الرئيسية (توقف كامل)
        document.getElementById('homeBtn').addEventListener('click', () => {
            // إيقاف وتدمير المشغل
            if (playerInstance) {
                playerInstance.remove();
                playerInstance = null;
            }
            
            // إعادة إنشاء الحاوية فارغة
            document.getElementById('playerContainer').innerHTML = '<div id="jwplayerDiv"></div>';
            
            // إظهار الصورة الافتراضية مرة أخرى
            homeImage.style.display = 'block';
            homeOverlay.style.display = 'flex';
            setTimeout(() => { 
                homeImage.style.opacity = '1'; 
                homeOverlay.style.opacity = '1';
            }, 50);

            // إزالة التحديد من القائمة
            document.querySelectorAll('.channel-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'border-blue-500', 'text-white');
                b.classList.add('bg-[#1a1d24]', 'border-[#2a2e39]', 'text-gray-300');
            });
        });

        // 4. نظام البحث في القنوات
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.channel-btn').forEach(btn => {
                const isMatch = btn.dataset.name.toLowerCase().includes(term);
                btn.style.display = isMatch ? 'flex' : 'none';
            });
        });

        // 5. حماية الصوت في الخلفية
        window.addEventListener("beforeunload", () => { 
            if(playerInstance) playerInstance.remove(); 
        });
        
        document.addEventListener("visibilitychange", () => {
            if (document.hidden && playerInstance) { 
                if(typeof playerInstance.pause === 'function') playerInstance.pause(); 
            }
        });

        // تهيئة التطبيق عند البداية
        window.onload = renderChannels;
    </script>
</body>
</html>
